overwrite: true
wandb_enabled: True


# Use registered model config
model:
  type: pi0_2stg_pytorch  # resolved via registry
  pi05: True

  
  model_kwargs:
    #default values
    1stg_loss_type: kl
    action_loss_weight: 1.0
    kl_loss_weight: 0.1
    1stg_rand_noise: False
    only_1stg: False
    use_0_noise: False #use zero initialization in stage two
    discrete_time_steps: 0 #stage two step count; 0 disables discrete_time_steps branch
    output_actions: False #directly predicts actions
    
    use_1stg: True
    times_list_train: [0.1]
    times_start_test: 0.1
    1stg_as_noise: True  # use stage-one KL prediction as noise
    1stg_output_mode: sample
    noise_var: 0.012345679  
    noisy_actions: clean_noise #stage-two noise mode: clean_noise or noise_injection
    
# Data configuration
data:
  type: lerobot_libero
  repo_id: physical-intelligence/yflibero_cam

  base_config:  # required; otherwise prompt missing error occurs
    type: data_config
    prompt_from_task: true
    use_quantile_norm: False  # whether to use quantile normalization (Q1 and Q99)
  extra_delta_transform: False  # whether to use delta transform
  repack_transforms:
    observation/image: image
    observation/wrist_image: wrist_image
    observation/state: state
    actions: actions
    prompt: prompt

# # Training parameters
batch_size: 16
num_train_steps: 60_000  # keep consistent with lr_schedule.decay_steps
ema_decay: 0.999


pytorch_weight_path: checkpoints/pytorch_pi05_base/

lr_schedule:
  type: cosine_decay_schedule
  warmup_steps: 10_000
  peak_lr: 5.0e-5
  decay_steps: 1_000_000
  decay_lr: 5.0e-5

optimizer:
  type: adamw
  clip_gradient_norm: 1.0

