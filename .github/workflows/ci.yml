name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruff

      - name: Ruff syntax checks
        run: |
          ruff check --select E9,F63,F7 --ignore F722 scripts src examples tests

      - name: Python compile checks
        run: |
          python -m compileall scripts src examples packages/openpi_client/src tests

      - name: Smoke tests
        run: |
          pytest -q tests/test_smoke.py
